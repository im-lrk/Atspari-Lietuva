<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pratybos | Vyčio Skliautas</title>
<style>
:root {
  --red:#C8102E; --red2:#e00035; --bg:#F3F4F7; --card:#fff; --border:rgba(20,24,40,.11);
  --text:#111827; --muted:#5A5D72; --muted2:#777B90;
  --shadow:0 4px 14px rgba(17,24,39,.08);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;font-size:15px;line-height:1.45}
.header{background:#fff;border-bottom:1px solid var(--border);padding:16px 22px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:30;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.brand{display:flex;gap:12px;align-items:center}
.logo{background:var(--red);color:#fff;font-weight:800;letter-spacing:.08em;padding:5px 10px;border-radius:4px;font-size:11px}
h1{font-size:20px;margin:0 0 2px;font-weight:800;letter-spacing:-.02em}
.sub{font-size:12px;color:var(--muted);font-family:Arial,sans-serif}
.back-link{font-size:13px;color:var(--muted);text-decoration:none;font-weight:700}
.back-link:hover{color:var(--red2)}

.main{padding:22px 20px 60px;max-width:1100px;margin:0 auto}

.search-wrap{margin-bottom:22px}
.search-input{
  width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:10px;
  font-size:15px;font-family:Arial,sans-serif;background:#fff;box-shadow:var(--shadow);
  color:var(--text);
}
.search-input:focus{outline:2px solid var(--red2);outline-offset:-1px}

.report-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.report-card{
  background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);
  padding:16px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;
  text-decoration:none;color:var(--text);transition:.12s;text-align:center;position:relative;
}
.report-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(17,24,39,.12);border-color:rgba(200,16,46,.35)}
.report-card:hover .report-date{color:var(--red2)}
.report-icon{font-size:20px;line-height:1}
.report-date{font-weight:800;font-size:15px;color:var(--text);word-break:break-word}
.report-note{font-size:11px;color:var(--muted2)}
.ext{position:absolute;top:7px;right:8px;font-size:10px;color:#b9bcc9}
.report-card:hover .ext{color:var(--red2)}

.empty-msg,.error-msg{padding:30px;text-align:center;color:var(--muted);font-size:14px;display:none}
.error-msg a{color:var(--red2);font-weight:700}
.footer-note{color:var(--muted);font-size:12px;margin-top:30px;text-align:center}

@media(max-width:600px){
  .main{padding:16px 14px 40px}
}
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <div class="logo">LRK</div>
    <div>
      <h1>Pratybų dokumentai — Vyčio Skliautas</h1>
      <div class="sub">Visi failai iš aplanko „Vycio-Skliautas"</div>
    </div>
  </div>
  <a class="back-link" href="index.html">← Visos ataskaitos</a>
</div>

<div class="main">
  <div class="search-wrap">
    <input type="text" class="search-input" id="searchBox" placeholder="Ieškoti failo (pvz. data arba pavadinimas)..." oninput="filterReports()">
  </div>

  <div class="report-grid" id="reportsContainer"></div>
  <div class="empty-msg" id="emptyMsg">Nerasta failų pagal paieškos žodį.</div>
  <div class="error-msg" id="errorMsg">
    Nepavyko automatiškai užkrauti sąrašo iš GitHub.
    Pažiūrėkite failus tiesiogiai
    <a href="https://github.com/im-lrk/Atspari-Lietuva/tree/main/Vycio-Skliautas" target="_blank" rel="noopener noreferrer">repozitorijoje</a>.
  </div>

  <div class="footer-note">Lietuvos Raudonasis Kryžius</div>
</div>

<script>
/* ============================================================
   Šis puslapis automatiškai užkrauna visų .html failų sąrašą
   iš aplanko "Vycio-Skliautas" per GitHub API (viešas repo,
   rakto nereikia). Pridėjus naują failą į tą aplanką GitHub'e,
   jis atsiras šiame sąraše savaime — nieko čia taisyti nereikia.
   ============================================================ */

const OWNER  = "im-lrk";
const REPO   = "Atspari-Lietuva";
const FOLDER = "Vycio-Skliautas";

let ALL_FILES = [];

function labelFromFilename(name) {
  return name.replace(/\.html?$/i, '').replace(/[-_]+/g, ' ');
}

function render(files) {
  const container = document.getElementById('reportsContainer');
  container.innerHTML = files.map(f => `
    <a class="report-card" href="${FOLDER}/${encodeURIComponent(f.name)}" target="_blank" rel="noopener noreferrer">
      <span class="ext">↗</span>
      <div class="report-icon">📄</div>
      <div class="report-date">${labelFromFilename(f.name)}</div>
    </a>`).join('');
}

function filterReports() {
  const term = document.getElementById('searchBox').value.trim().toLowerCase();
  const filtered = ALL_FILES.filter(f => f.name.toLowerCase().includes(term));
  document.getElementById('emptyMsg').style.display = filtered.length === 0 ? 'block' : 'none';
  render(filtered);
}

fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER}`)
  .then(r => {
    if (!r.ok) throw new Error('API error');
    return r.json();
  })
  .then(data => {
    ALL_FILES = data
      .filter(item => item.type === 'file' && /\.html?$/i.test(item.name))
      .sort((a, b) => b.name.localeCompare(a.name));
    if (ALL_FILES.length === 0) {
      document.getElementById('emptyMsg').style.display = 'block';
    } else {
      render(ALL_FILES);
    }
  })
  .catch(() => {
    document.getElementById('errorMsg').style.display = 'block';
  });
</script>

</body>
</html>
