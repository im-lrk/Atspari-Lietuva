<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vyčio Skliautas 2026 — dashboard</title>
<style>
:root{
  color-scheme: light;
  --bg:#f4f4f4; --surface:#ffffff; --line:#e2e2e2; --grid:#eeeeee;
  --ink:#1a1a1a; --ink2:#4d4d4d; --ink3:#767676;
  --s1:#d7141a; --s2:#8c8c8c; --track:#f1f1f1;
  --q1:#fde4e4; --q2:#f9bcbc; --q3:#f08a8a; --q4:#e04a4f; --q5:#c4101c; --q6:#8e0c16;
  --qt1:#1a1a1a; --qt2:#1a1a1a; --qt3:#1a1a1a; --qt4:#ffffff; --qt5:#ffffff; --qt6:#ffffff;
  --lrk:#d7141a; --lrk-dark:#a80f14;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --bg:#121212; --surface:#1c1c1c; --line:#333333; --grid:#2a2a2a;
    --ink:#ffffff; --ink2:#cfcfcf; --ink3:#a0a0a0;
    --s1:#ef4b4f; --s2:#9a9a9a; --track:#2c2c2c;
    --q1:#4a1013; --q2:#6e1519; --q3:#951b21; --q4:#c0262c; --q5:#e5484d; --q6:#f58a8d;
    --qt1:#ffffff; --qt2:#ffffff; --qt3:#ffffff; --qt4:#ffffff; --qt5:#1a1a1a; --qt6:#1a1a1a;
    --lrk:#d7141a; --lrk-dark:#a80f14;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121212; --surface:#1c1c1c; --line:#333333; --grid:#2a2a2a;
  --ink:#ffffff; --ink2:#cfcfcf; --ink3:#a0a0a0;
  --s1:#ef4b4f; --s2:#9a9a9a; --track:#2c2c2c;
  --q1:#4a1013; --q2:#6e1519; --q3:#951b21; --q4:#c0262c; --q5:#e5484d; --q6:#f58a8d;
  --qt1:#ffffff; --qt2:#ffffff; --qt3:#ffffff; --qt4:#ffffff; --qt5:#1a1a1a; --qt6:#1a1a1a;
  --lrk:#d7141a; --lrk-dark:#a80f14;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Verdana,"Segoe UI",system-ui,-apple-system,sans-serif}
.topbar{background:var(--surface);border-bottom:4px solid var(--lrk)}
.topbar .in{max-width:1180px;margin:0 auto;padding:16px 16px}
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.logo{background:var(--lrk);color:#fff;font-weight:700;padding:9px 11px;border-radius:3px;letter-spacing:.5px;font-size:16px}
h1{font-size:21px;margin:0;font-weight:700}
h1 small{display:block;font-size:14px;font-weight:400;color:var(--ink2);margin-top:2px}
.upd{margin-left:auto;font-size:14px;color:var(--ink);background:var(--bg);border-radius:4px;padding:6px 12px;white-space:nowrap}
.upd b{color:var(--lrk)}
.upd b{color:var(--ink)}
.kgroup{margin-bottom:14px}
.kh{font-size:15px;font-weight:700;color:var(--ink);margin:0 0 8px;padding-left:10px;border-left:4px solid var(--lrk);line-height:1.2}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(4,1fr)}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:11px 16px}
.tile .k{font-size:15.5px;font-weight:400;color:var(--ink);line-height:1.35}
.tile .k b{font-weight:700}
.tile .v{font-size:30px;font-weight:700;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums;color:var(--ink)}
.tile.hero{border:0;background:var(--lrk);color:#fff;padding:12px 17px}
.tile.hero .k,.tile.hero .v,.tile.hero .src{color:#fff}
.tile.hero .src{opacity:.9}
.tile.hero .v{font-size:34px}
.tile .src{font-size:14px;color:var(--ink);opacity:.75;margin-top:2px;line-height:1.35}
.loc{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:3px;margin-bottom:6px;line-height:1.4}
.loc.sp{background:#e6e6e6;color:#2b2b2b}
.loc.ac{background:#fde4e4;color:#a80f14}
.tile.sp{border-left:5px solid #8c8c8c}
.tile.ac{border-left:5px solid var(--lrk)}
.tile.hero .loc.ac{background:#fff;color:#a80f14}
@media (prefers-color-scheme: dark){:root:where(:not([data-theme="light"])) .loc.sp{background:#3a3a3a;color:#f0f0f0}:root:where(:not([data-theme="light"])) .loc.ac{background:#4a1013;color:#ffd6d6}}
:root[data-theme="dark"] .loc.sp{background:#3a3a3a;color:#f0f0f0}
:root[data-theme="dark"] .loc.ac{background:#4a1013;color:#ffd6d6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px;min-width:0}
.card.full{grid-column:1/-1}
.card h2{font-size:17px;margin:0 0 2px;font-weight:700}
.card{border-top:3px solid var(--lrk)}
.card .sub{font-size:14px;color:var(--ink);opacity:.8;margin:0 0 12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--ink);margin-bottom:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:12px}
.seg button{border:0;background:transparent;color:var(--ink2);font:inherit;font-size:14px;padding:6px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--lrk);color:#fff}
/* centre bars */
.crow{display:grid;grid-template-columns:170px 1fr 54px;align-items:center;gap:10px;margin:9px 0}
.crow .nm{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .tot{font-size:14px;font-weight:700;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.bar{display:flex;height:22px;gap:2px;background:transparent}
.bar span{display:block;height:100%;min-width:0}
.bar span:first-child{border-radius:4px 0 0 4px}
.bar span:last-child{border-radius:0 4px 4px 0}
.bar span:only-child{border-radius:4px}
.bar .now{background:var(--s1)}
.bar .out{background:var(--s2)}
#whereto .crow{grid-template-columns:270px 1fr 86px}
@media (max-width:640px){#whereto .crow{grid-template-columns:140px 1fr 70px}}
[hidden]{display:none!important}
.tabs{background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .in{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;gap:4px;flex-wrap:wrap}
.tabs button{font:inherit;font-size:16px;font-weight:700;padding:12px 20px;border:0;background:transparent;color:var(--ink2);border-bottom:4px solid transparent;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--lrk)}
.tabs button:focus-visible{outline:2px solid var(--lrk);outline-offset:-2px}
#needtype .crow,#needcenter .crow{grid-template-columns:270px 1fr 60px}
@media (max-width:640px){#needtype .crow,#needcenter .crow{grid-template-columns:140px 1fr 44px}}
#needs-app>.seg{margin-bottom:16px}
.seg{flex-wrap:wrap}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-bottom:16px}
.ctl .seg{margin-bottom:0}
.selw{font-size:15px;display:inline-flex;align-items:center;gap:8px}
.selw select{font:inherit;font-size:15px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.pbars .crow{grid-template-columns:270px 1fr 60px}
@media (max-width:640px){.pbars .crow{grid-template-columns:150px 1fr 44px}}
details p{margin:6px 0 0;line-height:1.5}
/* heatmap */
.tblwrap{overflow-x:auto}
.chartscroll{overflow-x:auto}
.chartscroll svg{min-width:520px}
#flows svg{min-width:760px}
table.hm{border-collapse:separate;border-spacing:2px;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.hm th{font-weight:700;color:var(--ink);text-align:center;padding:4px 6px;vertical-align:bottom;line-height:1.25}
.hm th.rl{text-align:left}
.hm td{text-align:center;padding:7px 6px;border-radius:4px;min-width:62px}
.hm td.rl{text-align:left;background:transparent;font-weight:500;min-width:130px;white-space:nowrap}
.hm tr.total td{font-weight:650}
.hm td.zero{color:var(--ink3);background:var(--track)}
/* svg charts */
svg{display:block;width:100%;height:auto;overflow:visible}
.axis text{fill:var(--ink2);font-size:12px}
.gridline{stroke:var(--grid);stroke-width:1}
.baseline{stroke:var(--line);stroke-width:1}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12.5px;padding:6px 9px;border-radius:6px;line-height:1.4;opacity:0;transition:opacity .08s;z-index:10;max-width:240px}
details{margin-top:10px;font-size:14px;color:var(--ink)}
details summary{cursor:pointer}
details table{border-collapse:collapse;margin-top:6px;font-variant-numeric:tabular-nums}
details td,details th{border-bottom:1px solid var(--line);padding:3px 10px 3px 0;text-align:left}
.empty{color:var(--ink3);font-size:13px;padding:14px 0}
.err{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;color:var(--ink2)}
@media (max-width:860px){
  .kpis{grid-template-columns:1fr 1fr}
  .grid{grid-template-columns:1fr}
  .upd{margin-left:0}
}
@media (max-width:480px){
  .crow{grid-template-columns:125px 1fr 36px}
  .crow .nm{font-size:13px}
  .tile .v{font-size:28px}
  .tile.hero .v{font-size:30px}
}
</style>
</head>

const fmt = n => (n == null || isNaN(n)) ? "–" : Number(n).toLocaleString("en-GB");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function parseTSV(text){
  const rows = [];
  text.replace(/^﻿/, "").split(/\r?\n/).forEach(line => {
    if (!line.trim()) return;
    const c = line.split("\t").map(x => x.trim().replace(/^"(.*)"$/, "$1"));
    if (c[0] === "Rodinys") return;
    const v = c[4] ?? "";
    const num = Number(v.replace(/\s/g, "").replace(",", "."));

  });
  return rows;
}

const tip = document.getElementById("tip");
function showTip(e, html){
  tip.innerHTML = html; tip.style.opacity = 1;
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + pad, y = e.clientY + pad;
  if (x + w > innerWidth - 8) x = e.clientX - w - pad;
  if (y + h > innerHeight - 8) y = e.clientY - h - pad;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip(){ tip.style.opacity = 0; }

function niceMax(v){
  if (v <= 5) return 5;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p;
  return 10 * p;
}

function renderNeeds(rows){
  const el = document.getElementById("needs-app");
  const NV = rows.filter(r => r.view.startsWith("POR_") && typeof r.value === "number");
  if (!NV.length) {
    el.innerHTML = `<div class="err">No needs data yet.</div>`;
    return;
  }
  const state = { scope: "DABAR", prio: "all" };
  const steps = ["--q1","--q2","--q3","--q4","--q5","--q6"];
  const sum = (arr, f) => arr.filter(f || (() => true)).reduce((s, x) => s + x.n, 0);
  const lbl = (map, k) => map[k] || k;

  function draw(){
    const sc = state.scope;
    const T = NV.filter(r => r.view === "POR_TIPAS_" + sc).map(r => {
      const [t, p] = r.key.split("|");
      return { c: r.center || "Not specified", t, p: p || "nenurodyta", n: r.value };
    });
    const Z = NV.filter(r => r.view === "POR_ZMONES_" + sc).map(r => ({ c: r.center || "Not specified", p: r.key, n: r.value }));
    const G = NV.filter(r => r.view === "POR_GRUPES_" + sc).map(r => ({ c: r.center || "Not specified", g: r.key, n: r.value }));

    const centers = [...new Set([...T.map(x => x.c), ...Z.map(x => x.c), ...G.map(x => x.c)])];
    centers.sort((a, b) => sum(Z, x => x.c === b) - sum(Z, x => x.c === a) || a.localeCompare(b, "en"));

    const total = sum(Z), pz = k => sum(Z, x => x.p === k);
    const types = [...new Set(T.map(x => x.t))];
    const tt = t => sum(T, x => x.t === t);
    types.sort((a, b) => tt(b) - tt(a));

    const legend = `<div class="legend">${PRIO.map(p => `<span><i style="background:var(${p.css})"></i>${p.label}</span>`).join("")}</div>`;
    const segBtns = (items, cur, attr) => items.map(([v, t]) => `<button type="button" ${attr}="${v}" aria-pressed="${cur === v}">${t}</button>`).join("");

    // heatmap
    const hmVal = (c, t) => sum(T, x => x.c === c && x.t === t && (state.prio === "all" || x.p === state.prio));
    const hmAll = types.flatMap(t => centers.map(c => hmVal(c, t)));
    const hmMax = Math.max(1, ...hmAll);
    const hmCell = (v, tip) => {
      if (!v) return `<td class="zero" data-t="${esc(tip)}: 0">0</td>`;
      const i = Math.min(steps.length - 1, Math.floor(v / hmMax * (steps.length - 1) + 0.0001));
      return `<td style="background:var(${steps[i]});color:var(--qt${i + 1})" data-t="${esc(tip)}: ${fmt(v)}">${fmt(v)}</td>`;
    };
    const hmTypes = types.filter(t => centers.some(c => hmVal(c, t) > 0));

    // groups
    const gKeys = [...new Set(G.map(x => x.g))];
    const gv = (c, g) => sum(G, x => x.c === c && x.g === g);
    gKeys.sort((a, b) => sum(G, x => x.g === b) - sum(G, x => x.g === a));
    const gMax = Math.max(1, ...gKeys.flatMap(g => centers.map(c => gv(c, g))));
    const gCell = (v, tip) => {
      if (!v) return `<td class="zero" data-t="${esc(tip)}: 0">0</td>`;
      const i = Math.min(steps.length - 1, Math.floor(v / gMax * (steps.length - 1) + 0.0001));
      return `<td style="background:var(${steps[i]});color:var(--qt${i + 1})" data-t="${esc(tip)}: ${fmt(v)}">${fmt(v)}</td>`;
    };

    const maxType = Math.max(1, ...types.map(tt));
    const maxCenter = Math.max(1, ...centers.map(c => sum(Z, x => x.c === c)));
    const stacked = (get, max) => PRIO.map(p => {
      const v = get(p.k);
      return v > 0 ? `<span style="width:${v / max * 100}%;background:var(${p.css})"></span>` : "";
    }).join("");

    el.innerHTML = `
      <div class="seg" role="group" aria-label="Scope of needs">
        <button type="button" data-scope="DABAR" aria-pressed="${sc === "DABAR"}">Currently in centre</button>
        <button type="button" data-scope="VISI" aria-pressed="${sc === "VISI"}">All registered</button>
      </div>

      <section class="kgroup">
        <h3 class="kh">People who need help</h3>
        <div class="kpis">
          <div class="tile hero ac"><span class="loc ac">Accommodation centres</span><div class="k"><b>People</b> with needs</div><div class="v">${fmt(total)}</div><div class="src">have at least one need${pz("nenurodyta") ? " · no priority: " + fmt(pz("nenurodyta")) : ""}</div></div>
          <div class="tile ac"><span class="loc ac">Accommodation centres</span><div class="k"><b>Urgent</b> / now</div><div class="v">${fmt(pz("urgent"))}</div><div class="src">people</div></div>
          <div class="tile ac"><span class="loc ac">Accommodation centres</span><div class="k">Within <b>a few hours</b></div><div class="v">${fmt(pz("hours"))}</div><div class="src">people</div></div>
          <div class="tile ac"><span class="loc ac">Accommodation centres</span><div class="k">Can <b>wait</b></div><div class="v">${fmt(pz("wait"))}</div><div class="src">people</div></div>
        </div>
      </section>

      <div class="grid">
        <section class="card full">
          <h2>Needs by type</h2>
          <p class="sub">How many people have each need. One person can have several needs.</p>
          ${legend}
          <div id="needtype">${types.map(t => {
            const tot = tt(t);
            return `<div class="crow" data-t="${esc(t)}"><div class="nm" title="${esc(lbl(NEED_TYPE_LABELS, t))}">${esc(lbl(NEED_TYPE_LABELS, t))}</div><div class="bar">${stacked(k => sum(T, x => x.t === t && x.p === k), maxType)}</div><div class="tot">${fmt(tot)}</div></div>`;
          }).join("")}</div>
        </section>

        <section class="card full">
          <h2>Needs by centre</h2>
          <p class="sub">Number of people by need type and centre</p>
          <div class="seg" role="group" aria-label="Urgency">
            ${segBtns([["all", "All"], ["urgent", "Urgent"], ["hours", "Few hours"], ["wait", "Can wait"], ["nenurodyta", "Not specified"]], state.prio, "data-prio")}
          </div>
          <div class="tblwrap" id="needhm">${hmTypes.length ? `<table class="hm">
            <tr><th class="rl">Need</th>${centers.map(c => `<th>${esc(c)}</th>`).join("")}<th>Total</th></tr>
            ${hmTypes.map(t => `<tr><td class="rl">${esc(lbl(NEED_TYPE_LABELS, t))}</td>${centers.map(c => hmCell(hmVal(c, t), `${c} · ${lbl(NEED_TYPE_LABELS, t)}`)).join("")}<td><b>${fmt(centers.reduce((s, c) => s + hmVal(c, t), 0))}</b></td></tr>`).join("")}
          </table>` : `<div class="empty">No data for this urgency</div>`}</div>
        </section>

        <section class="card full">
          <h2>Urgency by centre</h2>
          <p class="sub">People with needs that a volunteer rated by urgency</p>
          ${legend}
          <div id="needcenter">${centers.map(c => {
            const tot = sum(Z, x => x.c === c);
            return `<div class="crow" data-c="${esc(c)}"><div class="nm" title="${esc(c)}">${esc(c)}</div><div class="bar">${stacked(k => sum(Z, x => x.c === c && x.p === k), maxCenter)}</div><div class="tot">${fmt(tot)}</div></div>`;
          }).join("")}</div>
        </section>

        <section class="card full">
          <h2>Functional and specific needs</h2>
          <p class="sub">People with a functional or specific need marked at registration</p>
          <div class="tblwrap" id="needgroups">${gKeys.length ? `<table class="hm">
            <tr><th class="rl">Need</th>${centers.map(c => `<th>${esc(c)}</th>`).join("")}<th>Total</th></tr>
            ${gKeys.map(g => `<tr><td class="rl">${esc(lbl(GROUP_LABELS, g))}</td>${centers.map(c => gCell(gv(c, g), `${c} · ${lbl(GROUP_LABELS, g)}`)).join("")}<td><b>${fmt(sum(G, x => x.g === g))}</b></td></tr>`).join("")}
          </table>` : `<div class="empty">No data</div>`}</div>
        </section>
      </div>`;

    // events
    el.querySelectorAll("[data-scope]").forEach(b => b.addEventListener("click", () => { state.scope = b.dataset.scope; draw(); }));
    el.querySelectorAll("[data-prio]").forEach(b => b.addEventListener("click", () => { state.prio = b.dataset.prio; draw(); }));
    el.querySelectorAll("td[data-t]").forEach(td => {
      td.addEventListener("mousemove", e => showTip(e, esc(td.dataset.t) + " people"));
      td.addEventListener("mouseleave", hideTip);
    });
    el.querySelectorAll("#needtype .crow").forEach(row => {
      const t = row.dataset.t;
      row.addEventListener("mousemove", e => showTip(e, `<b>${esc(lbl(NEED_TYPE_LABELS, t))}</b><br>` +
        PRIO.map(p => `${p.label}: ${fmt(sum(T, x => x.t === t && x.p === p.k))}`).join("<br>") + `<br>Total: ${fmt(tt(t))}`));
      row.addEventListener("mouseleave", hideTip);
    });
    el.querySelectorAll("#needcenter .crow").forEach(row => {
      const c = row.dataset.c;
      row.addEventListener("mousemove", e => showTip(e, `<b>${esc(c)}</b><br>` +
        PRIO.map(p => `${p.label}: ${fmt(sum(Z, x => x.c === c && x.p === p.k))}`).join("<br>")));
      row.addEventListener("mouseleave", hideTip);
    });
  }
  draw();
}

    const hm = (v, tip) => {
      if (!v) return `<td class="zero" data-t="${esc(tip)}: 0">0</td>`;
      const i = Math.min(steps.length - 1, Math.floor(v / mx * (steps.length - 1) + 0.0001));
      return `<td style="background:var(${steps[i]});color:var(--qt${i + 1})" data-t="${esc(tip)}: ${fmt(v)}">${fmt(v)}</td>`;

    const pct = (a, b) => b ? Math.round(a / b * 100) + "%" : "–";
    const sudKeys = ["vienas_suauges", "tik_suaugusieji", "suaugusieji_su_vaikais", "vienas_su_vaikais", "tik_vaikai", "nenurodytas"];

          ${tile("80+ yrs", "Aged <b>80+</b>", sen("80+", "visi"), `alone: ${fmt(sen("80+", "vienisi_patvirtinta"))} · possibly: ${fmt(sen("80+", "vienisi_galimai"))}`)}

          ${tile("Needs", "<b>No other adult</b>", sp("bent_vienas", "nelydimi_patvirtinta"), `confirmed · possibly: ${fmt(sp("bent_vienas", "nelydimi_galimai"))}`, true)}
          ${tile("Needs", "<b>Pregnant women</b>", sp("pregnancy", "visi"), `no other adult: ${fmt(sp("pregnancy", "nelydimi_patvirtinta"))} · possibly: ${fmt(sp("pregnancy", "nelydimi_galimai"))}`)}

            ${specKeys.map(k => `<tr><td class="rl">${esc(GROUP_LABELS[k] || k)}</td><td><b>${fmt(sp(k, "visi"))}</b></td><td>${fmt(sp(k, "nelydimi_patvirtinta"))}</td><td>${fmt(sp(k, "nelydimi_galimai"))}</td></tr>`).join("")}

            { label: "65+ with no other adult (total)", v: cb("visi") },

            ${rowCenters.map(c => `<tr><td class="rl">${esc(c)}</td>${Object.keys(BAND_LABELS).map(b => hm(ageCell(c, b), `${c} · ${BAND_LABELS[b]}`)).join("")}</tr>`).join("")}
          </table></div>
        </section>

        <section class="card">
          <h2>Household composition</h2>

          <div class="pbars">${bars(sudKeys.map(k => ({ label: SUD_LABELS[k], v: nu("sud_" + k) })))}</div>
        </section>
        <section class="card">
          <h2>Household size</h2>
          <p class="sub">Number of households by number of registered members</p>
          <div class="pbars">${bars(["1", "2", "3", "4", "5+"].map(k => ({ label: k === "1" ? "1 person" : k + " people", v: nu("dydis_" + k) })))}</div>
        </section>

        <section class="card full">
          <h2>Registration reliability</h2>
          <p class="sub">How far the household composition numbers can be trusted (all centres)</p>
          <div class="kpis">
            ${tile("Registration", "<b>Households</b> in total", Q.namu_ukiai, "registered households")}
            ${tile("Registration", "<b>Complete</b> registration", Q.uzbaigti, `all members of the stated size registered · ${pct(Q.uzbaigti, Q.namu_ukiai)}`)}
            ${tile("Registration", "Link <b>not checked</b>", Q.rysys_nepatikrintas, "households where the representative is unknown")}
            ${tile("Registration", "<b>No birth year</b>", Q.be_gimimo_metu, "people")}
          </div>
        </section>
      </div>`;

    el.querySelectorAll("[data-scope]").forEach(b => b.addEventListener("click", () => { state.scope = b.dataset.scope; draw(); }));
    const s = el.querySelector("#pc");
    s.addEventListener("change", () => { state.center = s.value; draw(); });
    el.querySelectorAll("td[data-t]").forEach(td => {
      td.addEventListener("mousemove", e => showTip(e, esc(td.dataset.t) + " people"));
      td.addEventListener("mouseleave", hideTip);
    });
  }
  draw();
}

const TABS = { overview: ["app", ""], needs: ["needs-app", "#needs"], people: ["people-app", "#people"] };
function setTab(name){
  Object.entries(TABS).forEach(([k, [id]]) => { document.getElementById(id).hidden = k !== name; });
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === name ? "true" : "false"));
  try { history.replaceState(null, "", TABS[name][1] || location.pathname + location.search); } catch (e) {}
}
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));
if (location.hash === "#needs") setTab("needs");
if (location.hash === "#people") setTab("people");

function render(rows){
  const kpi = k => (rows.find(r => r.view === "KPI" && r.key === k) || {}).value;
  const meta = rows.find(r => r.view === "META" && r.key === "atnaujinta");
  document.getElementById("upd").innerHTML = meta ? `Data updated: <b>${esc(meta.value)}</b>` : "Update time not specified";

  // centres
  const centers = [...new Set(rows.filter(r => r.view === "CENTRAS").map(r => r.center))];
  const cval = (c, k) => (rows.find(r => r.view === "CENTRAS" && r.center === c && r.key === k) || {}).value || 0;
  centers.sort((a, b) => cval(b, "uzregistruota") - cval(a, "uzregistruota"));

  // timeline
  const times = [...new Set(rows.filter(r => r.view === "EIGA").map(r => r.time))].sort();
  const tval = (t, k) => (rows.find(r => r.view === "EIGA" && r.time === t && r.key === k) || {}).value || 0;

  const app = document.getElementById("app");
  app.innerHTML = `
    <section class="kgroup">
      <h3 class="kh">Households: from collection point to centre</h3>
      <div class="kpis">
        <div class="tile sp"><span class="loc sp">Collection points</span><div class="k"><b>Households</b> registered</div><div class="v">${fmt(kpi("surinkimo_namu_ukiai"))}</div><div class="src">household representatives</div></div>
        <div class="tile sp"><span class="loc sp">Collection points</span><div class="k"><b>People</b> in them</div><div class="v">${fmt(kpi("surinkimo_zmones"))}</div><div class="src">by stated household size</div></div>
        <div class="tile ac"><span class="loc ac">Accommodation centres</span><div class="k"><b>All members</b> arrived</div><div class="v">${fmt(kpi("namu_ukiai_visi"))}</div><div class="src">households out of ${fmt(kpi("surinkimo_namu_ukiai"))}: all their members are already registered in centres</div></div>
        <div class="tile ac"><span class="loc ac">Accommodation centres</span><div class="k"><b>Not all members</b> arrived</div><div class="v">${fmt(kpi("namu_ukiai_truksta"))}</div><div class="src">households out of ${fmt(kpi("surinkimo_namu_ukiai"))}: some members are not yet registered in centres</div></div>
      </div>
    </section>
    <section class="kgroup">
      <h3 class="kh">People in accommodation centres</h3>
      <div class="kpis">
        <div class="tile hero ac"><span class="loc ac">Accommodation centres</span><div class="k"><b>Currently</b> in centres</div><div class="v">${fmt(kpi("centruose_dabar"))}</div><div class="src">people</div></div>
        <div class="tile ac"><span class="loc ac">Accommodation centres</span><div class="k"><b>Registered</b> in total</div><div class="v">${fmt(kpi("centruose_uzregistruota"))}</div><div class="src">people since the start</div></div>
        <div class="tile ac"><span class="loc ac">Accommodation centres</span><div class="k"><b>Left</b> the centres</div><div class="v">${fmt(kpi("isvyko"))}</div><div class="src">people</div></div>
        <div class="tile ac"><span class="loc ac">Accommodation centres</span><div class="k"><b>Number</b> of centres</div><div class="v">${fmt(centers.length)}</div><div class="src">accommodation centres</div></div>
      </div>
    </section>

    <div class="grid">
      <section class="card">
        <h2>Occupancy by centre</h2>
        <p class="sub">Registered people: currently in the centre and already left</p>
        <div class="legend"><span><i style="background:var(--s1)"></i>Currently in centre</span><span><i style="background:var(--s2)"></i>Left</span></div>
        <div id="centres"></div>
        <details><summary>Table</summary><table>
          <tr><th>Centras</th><th>Registered</th><th>Currently in centre</th><th>Left</th></tr>
          ${centers.map(c => `<tr><td>${esc(c)}</td><td>${fmt(cval(c,"uzregistruota"))}</td><td>${fmt(cval(c,"dabar"))}</td><td>${fmt(cval(c,"isvyko"))}</td></tr>`).join("")}
        </table></details>
      </section>

      <section class="card">
        <h2>Number of people in centres over time</h2>
        <p class="sub">How many people were in the centres at the end of each hour</p>
        <div class="chartscroll" id="line"></div>
        <details><summary>Table</summary><table>
          <tr><th>Time</th><th>In centres</th></tr>
          ${times.map(t => `<tr><td>${esc(t)}</td><td>${fmt(tval(t,"centruose_tuo_metu"))}</td></tr>`).join("")}
        </table></details>
      </section>

      <section class="card full" id="whereto-card">
        <h2>Where people go</h2>
        <p class="sub">People who left, by reason for leaving (all centres)</p>
        <div id="whereto"></div>
        <details><summary>Table by centre</summary><div class="tblwrap" id="wheretotbl"></div></details>
      </section>

      <section class="card full">
        <h2>Needs by centre</h2>
        <p class="sub">Number of people with a need marked at registration</p>
        <div class="seg" role="group" aria-label="Scope of needs">
          <button type="button" data-v="POREIKIAI_DABAR" aria-pressed="true">Currently in centre</button>
          <button type="button" data-v="POREIKIAI_VISI" aria-pressed="false">All registered</button>
        </div>
        <div class="tblwrap" id="needs"></div>
      </section>

      <section class="card full">
        <h2>Flows per hour</h2>
        <p class="sub">People who arrived at centres and who left, each hour</p>
        <div class="legend"><span><i style="background:var(--s1)"></i>Arrived at centres</span><span><i style="background:var(--s2)"></i>Left</span></div>
        <div class="chartscroll" id="flows"></div>
        <details><summary>Table</summary><table>
          <tr><th>Time</th><th>In collection points (households)</th><th>Arrived at centres</th><th>Left</th></tr>
          ${times.map(t => `<tr><td>${esc(t)}</td><td>${fmt(tval(t,"surinkimo_namu_ukiai"))}</td><td>${fmt(tval(t,"atvyko_i_centrus"))}</td><td>${fmt(tval(t,"isvyko"))}</td></tr>`).join("")}
        </table></details>
      </section>
    </div>`;

  // ---- centre bars
  const cmax = Math.max(1, ...centers.map(c => cval(c, "uzregistruota")));
  const cEl = document.getElementById("centres");
  cEl.innerHTML = centers.length ? centers.map(c => {
    const now = cval(c, "dabar"), out = cval(c, "isvyko"), tot = cval(c, "uzregistruota");
    const segs = [];
    if (now > 0) segs.push(`<span class="now" style="width:${now / cmax * 100}%"></span>`);
    if (out > 0) segs.push(`<span class="out" style="width:${out / cmax * 100}%"></span>`);
    return `<div class="crow" data-c="${esc(c)}"><div class="nm" title="${esc(c)}">${esc(c)}</div><div class="bar">${segs.join("")}</div><div class="tot">${fmt(tot)}</div></div>`;
  }).join("") : `<div class="empty">No data</div>`;
  cEl.querySelectorAll(".crow").forEach(row => {
    const c = row.dataset.c;
    row.addEventListener("mousemove", e => showTip(e, `<b>${esc(c)}</b><br>Currently in centre: ${fmt(cval(c,"dabar"))}<br>Left: ${fmt(cval(c,"isvyko"))}<br>Registered: ${fmt(cval(c,"uzregistruota"))}`));
    row.addEventListener("mouseleave", hideTip);
  });

  // ---- where do people go
  const depRows = rows.filter(r => r.view === "ISVYKIMAI_KUR" && typeof r.value === "number");
  const depTypes = [...new Set(depRows.map(r => r.key))];
  const depSum = k => depRows.filter(r => r.key === k).reduce((s, r) => s + r.value, 0);
  depTypes.sort((a, b) => depSum(b) - depSum(a));
  const depTotal = depTypes.reduce((s, k) => s + depSum(k), 0);
  const wEl = document.getElementById("whereto");
  if (!depTotal) {
    wEl.innerHTML = `<div class="empty">No departures yet</div>`;
    document.getElementById("whereto-card").querySelector("details").style.display = "none";
  } else {
    const dmax = Math.max(...depTypes.map(depSum));
    wEl.innerHTML = depTypes.map(k => {
      const v = depSum(k), pct = Math.round(v / depTotal * 100);
      return `<div class="crow" data-k="${esc(k)}"><div class="nm" title="${esc(DEP_LABELS[k] || k)}">${esc(DEP_LABELS[k] || k)}</div><div class="bar"><span class="now" style="width:${v / dmax * 100}%"></span></div><div class="tot">${fmt(v)} <small style="font-weight:400;color:var(--ink3)">${pct}%</small></div></div>`;
    }).join("");
    wEl.querySelectorAll(".crow").forEach(row => {
      const k = row.dataset.k;
      row.addEventListener("mousemove", e => {
        const per = depRows.filter(r => r.key === k && r.value > 0).map(r => `${esc(r.center || "Not specified")}: ${fmt(r.value)}`).join("<br>");
        showTip(e, `<b>${esc(DEP_LABELS[k] || k)}</b><br>Total: ${fmt(depSum(k))}<br>${per}`);
      });
      row.addEventListener("mouseleave", hideTip);
    });
    const dcs = [...new Set(depRows.map(r => r.center || "Not specified"))].sort();
    const dv = (c, k) => depRows.filter(r => (r.center || "Not specified") === c && r.key === k).reduce((s, r) => s + r.value, 0);
    document.getElementById("wheretotbl").innerHTML = `<table class="hm">
      <tr><th class="rl">Centre</th>${depTypes.map(k => `<th>${esc(DEP_LABELS[k] || k)}</th>`).join("")}<th>Total</th></tr>
      ${dcs.map(c => `<tr><td class="rl">${esc(c)}</td>${depTypes.map(k => dv(c, k) ? `<td>${fmt(dv(c, k))}</td>` : `<td class="zero">0</td>`).join("")}<td><b>${fmt(depTypes.reduce((s, k) => s + dv(c, k), 0))}</b></td></tr>`).join("")}
      <tr class="total"><td class="rl">Total</td>${depTypes.map(k => `<td>${fmt(depSum(k))}</td>`).join("")}<td>${fmt(depTotal)}</td></tr>
    </table>`;
  }

  // ---- needs heatmap
  const needKeys = Object.keys(NEED_LABELS);
  const drawNeeds = view => {
    const nv = (c, k) => (rows.find(r => r.view === view && r.center === c && r.key === k) || {}).value || 0;
    const tot = k => centers.reduce((s, c) => s + nv(c, k), 0);
    const all = centers.flatMap(c => needKeys.map(k => nv(c, k)));
    const mx = Math.max(1, ...all);
    const steps = ["--q1","--q2","--q3","--q4","--q5","--q6"];
    const cell = (v, label) => {
      if (!v) return `<td class="zero" data-t="${esc(label)}: 0">0</td>`;
      const i = Math.min(steps.length - 1, Math.floor(v / mx * (steps.length - 1) + 0.0001));
      return `<td style="background:var(${steps[i]});color:var(--qt${i + 1})" data-t="${esc(label)}: ${fmt(v)}">${fmt(v)}</td>`;
    };
    document.getElementById("needs").innerHTML = centers.length ? `<table class="hm">
      <tr><th class="rl">Centre</th>${needKeys.map(k => `<th>${NEED_LABELS[k]}</th>`).join("")}</tr>
      ${centers.map(c => `<tr><td class="rl">${esc(c)}</td>${needKeys.map(k => cell(nv(c, k), `${c} · ${NEED_LABELS[k]}`)).join("")}</tr>`).join("")}
      <tr class="total"><td class="rl">Total</td>${needKeys.map(k => `<td>${fmt(tot(k))}</td>`).join("")}</tr>
    </table>` : `<div class="empty">No data</div>`;
    document.querySelectorAll("#needs td[data-t]").forEach(td => {
      td.addEventListener("mousemove", e => showTip(e, esc(td.dataset.t) + " people"));
      td.addEventListener("mouseleave", hideTip);
    });
  };
  document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
    drawNeeds(b.dataset.v);
  }));
  drawNeeds("POREIKIAI_DABAR");

  // ---- shared chart frame
  const W = 560, H = 240, M = { l: 36, r: 12, t: 12, b: 34 };
  const label = t => t.slice(5).replace(" ", " ");
  const tickEvery = n => Math.max(1, Math.ceil(n / 4));
  const yAxis = (ymax, w) => {
    let g = "";
    for (let i = 0; i <= 4; i++) {
      const v = ymax * i / 4, y = M.t + (H - M.t - M.b) * (1 - i / 4);
      g += `<line class="${i ? "gridline" : "baseline"}" x1="${M.l}" x2="${w - M.r}" y1="${y}" y2="${y}"/>`;
      g += `<text x="${M.l - 6}" y="${y + 4}" text-anchor="end">${fmt(Math.round(v))}</text>`;
    }
    return g;
  };

  // ---- line: people in centres over time
  const lineEl = document.getElementById("line");
  if (!times.length) lineEl.innerHTML = `<div class="empty">No data</div>`;
  else {
    const vals = times.map(t => tval(t, "centruose_tuo_metu"));
    const ymax = niceMax(Math.max(...vals));
    const iw = W - M.l - M.r, ih = H - M.t - M.b;
    const x = i => M.l + (times.length === 1 ? iw / 2 : iw * i / (times.length - 1));
    const y = v => M.t + ih * (1 - v / ymax);
    const path = vals.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
    const te = tickEvery(times.length);
    const ticks = times.map((t, i) => i % te === 0 ? `<text x="${x(i)}" y="${H - 12}" text-anchor="middle">${esc(label(t))}</text>` : "").join("");
    const last = vals.length - 1;
    lineEl.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Number of people in centres over time">
      <g class="axis">${yAxis(ymax, W)}${ticks}</g>
      <path d="${path}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${x(last)}" cy="${y(vals[last])}" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>
      <text x="${x(last) - 8}" y="${y(vals[last]) - 10}" text-anchor="end" style="fill:var(--ink);font-size:12px;font-weight:600">${fmt(vals[last])}</text>
      <line id="xh" x1="0" x2="0" y1="${M.t}" y2="${H - M.b}" stroke="var(--ink3)" stroke-width="1" opacity="0"/>
      <circle id="xd" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2" opacity="0"/>
      <rect x="${M.l}" y="${M.t}" width="${iw}" height="${ih}" fill="transparent" id="hit"/>
    </svg>`;
    const svg = lineEl.querySelector("svg"), xh = svg.querySelector("#xh"), xd = svg.querySelector("#xd");
    svg.querySelector("#hit").addEventListener("mousemove", e => {
      const r = svg.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width * W;
      const i = Math.max(0, Math.min(times.length - 1, Math.round((px - M.l) / (iw / Math.max(1, times.length - 1)))));
      xh.setAttribute("x1", x(i)); xh.setAttribute("x2", x(i)); xh.setAttribute("opacity", .5);
      xd.setAttribute("cx", x(i)); xd.setAttribute("cy", y(vals[i])); xd.setAttribute("opacity", 1);
      showTip(e, `<b>${esc(times[i])}</b><br>In centres: ${fmt(vals[i])} people`);
    });
    svg.querySelector("#hit").addEventListener("mouseleave", () => { hideTip(); xh.setAttribute("opacity", 0); xd.setAttribute("opacity", 0); });
  }

  // ---- grouped bars: arrivals / departures per hour
  const flowsEl = document.getElementById("flows");
  if (!times.length) flowsEl.innerHTML = `<div class="empty">No data</div>`;
  else {
    const FW = 1120, FH = 240;
    const arr = times.map(t => tval(t, "atvyko_i_centrus")), dep = times.map(t => tval(t, "isvyko"));
    const ymax = niceMax(Math.max(1, ...arr, ...dep));
    const iw = FW - M.l - M.r, ih = FH - M.t - M.b;
    const band = iw / times.length, bw = Math.max(3, Math.min(18, (band - 8) / 2));
    const y = v => M.t + ih * (1 - v / ymax);
    const bar = (cx, v, col) => {
      if (!v) return "";
      const top = y(v), h = M.t + ih - top, r = Math.min(4, bw / 2, h);
      return `<path d="M${cx},${M.t + ih} V${top + r} q0,-${r} ${r},-${r} h${bw - 2 * r} q${r},0 ${r},${r} V${M.t + ih} Z" fill="${col}"/>`;
    };
    const te = Math.max(1, Math.ceil(times.length / 9));
    let g = "";
    times.forEach((t, i) => {
      const c = M.l + band * i + band / 2;
      g += bar(c - bw - 1, arr[i], "var(--s1)") + bar(c + 1, dep[i], "var(--s2)");
      if (i % te === 0) g += `<text x="${c}" y="${FH - 12}" text-anchor="middle">${esc(label(t))}</text>`;
      g += `<rect class="fh" data-i="${i}" x="${M.l + band * i}" y="${M.t}" width="${band}" height="${ih}" fill="transparent"/>`;
    });
    const yax = (() => { let s = ""; for (let k = 0; k <= 4; k++) { const v = ymax * k / 4, yy = M.t + ih * (1 - k / 4); s += `<line class="${k ? "gridline" : "baseline"}" x1="${M.l}" x2="${FW - M.r}" y1="${yy}" y2="${yy}"/><text x="${M.l - 6}" y="${yy + 4}" text-anchor="end">${fmt(Math.round(v))}</text>`; } return s; })();
    flowsEl.innerHTML = `<svg viewBox="0 0 ${FW} ${FH}" role="img" aria-label="People arrived and left per hour"><g class="axis">${yax}${g}</g></svg>`;
    flowsEl.querySelectorAll(".fh").forEach(r => {
      const i = +r.dataset.i;
      r.addEventListener("mousemove", e => showTip(e, `<b>${esc(times[i])}</b><br>Arrived at centres: ${fmt(arr[i])}<br>Left: ${fmt(dep[i])}<br>In collection points: ${fmt(tval(times[i],"surinkimo_namu_ukiai"))} households`));
      r.addEventListener("mouseleave", hideTip);
    });
  }
  renderNeeds(rows);
  renderPeople(rows);
}

render(parseTSV(RAW_TSV));
</script>
</body>
</html>
