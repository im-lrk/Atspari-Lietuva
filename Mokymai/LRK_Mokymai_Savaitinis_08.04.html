let active='ALL', chart=null;
const periods=PAYLOAD.meta.periods;
function totals(d){let x={iv:0,ne:0,su:0};d.monthly.forEach(m=>{x.iv+=m.iv;x.ne+=m.ne;x.su+=m.su});return x}
function cellClass(w){if(w.iv&&w.ne)return 'mix iv2';if(w.ne)return 'ne';if(w.su)return w.su>5?'su3':w.su>2?'su2':'su1';if(w.iv)return w.iv>20?'iv4':w.iv>10?'iv3':w.iv>4?'iv2':'iv1';return 'z'}
function cellText(w){let a=[];if(w.iv)a.push(w.iv+'✓');if(w.ne)a.push(w.ne+'✗');if(w.su)a.push(w.su+'◷');return a.length?a.join('/'):'·'}
function renderTabs(){document.getElementById('tabs').innerHTML=Object.entries(PAYLOAD.data).map(([k,d])=>`<div class="tab ${k===active?'act':''}" onclick="active='${k}';renderTabs();render()">${d.label}</div>`).join('')}
function heat(title,rows,meta){let qrow='<tr><th class="name">Pavadinimas</th><th class="meta">'+(meta==='region'?'Regionas':'Skyrius')+'</th>'+periods.map((p,i)=>`<th class="${p.q.toLowerCase()} ${i===0||periods[i-1].q!==p.q?'q-start':''}">${p.label}</th>`).join('')+'</tr>';
let body=rows.map(r=>`<tr><td class="name">${r.name}</td><td class="meta">${meta==='region'?r.region:r.sky}</td>${r.weeks.map((w,i)=>`<td class="${i===0||periods[i-1].q!==periods[i].q?'q-start':''}"><div class="cell ${cellClass(w)}">${cellText(w)}</div></td>`).join('')}</tr>`).join('');
return `<div class="sec-label">${title}</div><div class="card"><div class="legend"><span><i class="dot" style="background:#179b52"></i>Įvyko</span><span><i class="dot" style="background:#ff304f"></i>Neįvyko</span><span><i class="dot" style="background:#8f50dc"></i>Suplanuota</span></div><div class="hm-wrap"><table><thead>${qrow}</thead><tbody>${body}</tbody></table></div></div>`}
function render(){let d=PAYLOAD.data[active],t=totals(d);document.getElementById('main').innerHTML=`<div class="kpi-row"><div class="kpi"><div class="kpi-title">Įvyko</div><div class="kpi-val">${t.iv}</div></div><div class="kpi"><div class="kpi-title">Neįvyko</div><div class="kpi-val">${t.ne}</div></div><div class="kpi"><div class="kpi-title">Suplanuota</div><div class="kpi-val">${t.su}</div></div><div class="kpi"><div class="kpi-title">Viso</div><div class="kpi-val">${t.iv+t.ne+t.su}</div></div></div><div class="sec-label">Renginiai pagal mėnesį</div><div class="card"><div class="chart-wrap"><canvas id="chart"></canvas></div></div>${heat('Savaitinis vaizdas — skyriai',d.sections,'region')}${heat('Koordinatoriai × savaitės',d.coords,'sky')}<div class="note">Q1 apima 2026-01-01–2026-03-31, Q2 – 2026-04-01–2026-06-30. Q3 rodoma savaitėmis. Po 2026-08-04 esantys įrašai laikomi suplanuotais.</div>`;
if(chart)chart.destroy(); chart=new Chart(document.getElementById('chart'),{type:'bar',data:{labels:d.monthly.map(m=>m.month),datasets:[{label:'Įvyko',data:d.monthly.map(m=>m.iv),backgroundColor:'#249c5a',stack:'s'},{label:'Neįvyko',data:d.monthly.map(m=>m.ne),backgroundColor:'#ff304f',stack:'s'},{label:'Suplanuota',data:d.monthly.map(m=>m.su),backgroundColor:'#9d4edd',stack:'s'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{x:{stacked:true},y:{stacked:true,beginAtZero:true}}}})}
renderTabs();render();
